name: Update Skin Prices Daily

on:
  schedule:
    # Täglich um 02:00 UTC ausführen
    - cron: '0 2 * * *'
  workflow_dispatch: # Ermöglicht manuelles Triggern
    inputs:
      skinIds:
        description: 'Comma-separated Skin IDs (leer = alle)'
        required: false
        type: string

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Price Update Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAMWEBAPI_KEY: ${{ secrets.STEAM_API_KEY }}
          NODE_ENV: production
        run: |
          cd backend
          node scripts/updateSkinPrices.js

      - name: Create Summary
        if: always()
        run: |
          echo "## Skin Price Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skinIds }}" != "" ]; then
            echo "- **Target:** Specific Skins (${{ inputs.skinIds }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Target:** All Skins" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Skin price update failed! Check the logs for details."

