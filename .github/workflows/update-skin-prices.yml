name: Update Skin Prices

on:
  schedule:
    - cron: '0 2 * * *'  # Täglich um 02:00 UTC
  workflow_dispatch:  # Manueller Trigger

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
          
      - name: Update Skin Prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          cd backend
          node scripts/updateSkinPrices.js
          
      - name: Create Summary
        if: always()
        run: |
          echo "## Skin Prices Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Skin prices update failed! Check the logs for details."