name: Update Skin Prices

on:
  schedule:
    - cron: '0 2 * * *'  # Täglich um 02:00 UTC
  workflow_dispatch:  # Manueller Trigger

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          
      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
          
      - name: Update Skin Prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAMWEBAPI_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          cd backend
          node scripts/updateSkinPrices.js