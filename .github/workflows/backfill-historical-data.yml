name: Backfill Historical Data

on:
  workflow_dispatch: # Nur manueller Trigger
    inputs:
      confirm_backfill:
        description: 'Type "CONFIRM" to run historical data backfill'
        required: true
        default: ''

jobs:
  backfill-historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_backfill }}" != "CONFIRM" ]; then
            echo "❌ Confirmation required. Please type 'CONFIRM' to run the backfill."
            exit 1
          fi
          echo "✅ Confirmation received. Starting historical data backfill..."

      - name: Backfill Historical Data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          NODE_ENV: production
        run: |
          cd backend
          node scripts/backfillHistoricalData.js
          
      - name: Log Success Details
        if: success()
        run: |
          echo "✅ Historical data backfill completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 This script has:" >> $GITHUB_STEP_SUMMARY
          echo "- Generated 90 days of price history data" >> $GITHUB_STEP_SUMMARY
          echo "- Generated 90 days of quantity history data" >> $GITHUB_STEP_SUMMARY
          echo "- Used realistic variations based on current market data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Daily workflows will now maintain this data going forward." >> $GITHUB_STEP_SUMMARY

      - name: Create Summary
        if: always()
        run: |
          echo "## Historical Data Backfill Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Confirmation:** ${{ github.event.inputs.confirm_backfill }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Historical data backfill failed! Check the logs for details."

