name: Save Price History Daily

on:
  schedule:
    # Täglich um 03:00 UTC (nach Preis-Update) ausführen
    - cron: '0 3 * * *'
  workflow_dispatch: # Ermöglicht manuelles Triggern

jobs:
  save-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Save Price History
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          cd backend
          node scripts/savePriceHistory.js
          
      - name: Log Success Details
        if: success()
        run: |
          echo "✅ Price history successfully saved to database" >> $GITHUB_STEP_SUMMARY

      - name: Create Summary
        if: always()
        run: |
          echo "## Price History Save Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Price history save failed! Check the logs for details."

