name: Scheduled Price Refresh

# WHY THIS EXISTS (2026-05-29):
# Price refresh was wired to run on Inngest (4×/day cron → HTTP callback to the
# Render-hosted /api/inngest endpoint). But Render's free tier spins the service
# down between Inngest step.run() invocations, so each cron run only completed
# ~1 chunk (~8 skins) before a cold-start timeout aborted the function.
# Result: PriceHistory grew at 25-30 rows/day instead of 2000+, and charts
# stopped updating after 2026-05-22.
#
# GitHub Actions runners DON'T spin down — they run the full job uninterrupted
# for up to 6h and connect directly to Supabase, bypassing both Render and
# Inngest entirely. This was the project's ORIGINAL price-update design
# (see CLAUDE.md "GitHub Actions for price updates — Free CI/CD"). The
# manual-job.yml proved this path works (1 successful run 2026-05-10).
#
# Public repo → unlimited free Actions minutes. This is the primary price-refresh
# driver now; the Inngest price-refresh function is left mounted but redundant
# (it harmlessly does ~8 skins before Render sleeps; safe to disable later).

on:
  schedule:
    # Twice daily, UTC. runPriceRefresh() caps at MAX_SKINS_PER_RUN=2000 stalest
    # skins + all cases + 1000 market items per run, ordered priceUpdatedAt-asc.
    # 2 runs/day = ~4000 skins refreshed/day → full 16.8k catalog every ~4 days,
    # always refreshing the stalest rows first. GH cron can lag 5-15 min under
    # load; fine for daily pricing.
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  # Keep manual trigger so we can test on-demand from the Actions tab.
  workflow_dispatch:

# Never let two refreshes overlap (would double the Steam Market request rate
# and risk a 429 ban on the runner IP).
concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run price refresh
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # TECH-DEBT (tracked in CLAUDE.md): mirrors manual-job.yml's proven-working
          # config. Supabase pooler + Node 22 can throw self-signed-cert-in-chain on
          # some runners; this flag sidesteps it. The connection only writes public
          # price data (no secrets flow back), so MITM exposure is low — but the
          # correct fix is `?sslmode=require` on a CA the runner trusts. Revisit.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/run-job.js price-refresh
