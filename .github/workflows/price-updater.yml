name: Price Updater

on:
  schedule:
    # Run daily at 00:00 UTC (2:00 AM CET, midnight UTC)
    - cron: '0 0 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Fetch prices from Steam Market API
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          NODE_ENV: production
          PRICE_UPDATE_BATCH_SIZE: 1000
          PRICE_UPDATE_ONLY_ACTIVE: 'true'
          PRICE_UPDATE_RETRIES: 2
          PRICE_UPDATE_RETRY_DELAY_MS: 200
          PRICE_UPDATE_GLOBAL_DELAY_MS: 40
        run: node scripts/updateSkinPrices.js

      - name: Create Summary
        if: always()
        run: |
          echo "## Price Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: echo "::error::Price update failed! Check the logs for details."
