# backend/render.yaml — [Backend]
# {/* Render Configuration for CS2 Skin Tracker Backend */}
services:
  - type: web
    name: cs2-skin-tracker-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run render:deploy
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cs2-skin-tracker-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    autoDeploy: true
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerfilePath: ./Dockerfile

databases:
  - name: cs2-skin-tracker-db
    plan: starter
    databaseName: cs2_skin_tracker
    user: cs2_user
